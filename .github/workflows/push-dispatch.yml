name: push-dispatch

on:
  schedule:
    - cron: "7 * * * *" # a cada hora, no minuto 7 (UTC)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the push dispatch endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/push/dispatch"
