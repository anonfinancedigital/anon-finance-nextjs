<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D111A" />
    <title>ANON • Sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #0d111a;
        color: #f4f5f9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      .brand { margin: 0 0 2rem; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.2em; color: #a78bfa; }
      h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }
      p { margin: 0 0 2rem; line-height: 1.5; color: #aab0c0; }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        background: #7c3aed;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #a78bfa; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">ANON</p>
      <h1>Você está sem conexão</h1>
      <p>Seus dados continuam protegidos. Reconecte-se para continuar.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
